    <text x="100" y="300" fill="#fff" font-size="80" font-weight="700">Behind the Pay Button</text>
    <text x="100" y="370" fill="#aaa" font-size="32">Routing, orchestration and payment correctness</text>
    <g stroke="#35607e" stroke-width="3" fill="#062b49">
